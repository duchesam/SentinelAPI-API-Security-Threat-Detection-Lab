services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:local-lab-only@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["lab-keys:/app/.state"]
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: local-lab-only
    volumes: ["lab-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  gateway:
    image: nginx:1.27.5-alpine
    ports: ["127.0.0.1:8081:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm"]
    ports: ["127.0.0.1:8082:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-idp-only
    volumes: ["./infra/sentinel-realm.json:/opt/keycloak/data/import/sentinel-realm.json:ro"]
volumes:
  lab-db:
  lab-keys:
